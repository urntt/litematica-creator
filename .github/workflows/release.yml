name: Release

# Publishes the JAR validated at the exact commit being released; see docs/releasing.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and preview only; create no tag or release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version, tag and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Check the release candidate
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(prepare --event "$EVENT" --ref-name "$REF_NAME" --notes build/release-notes.md)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 scripts/release.py "${args[@]}"
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists; versions are never republished"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists; versions are never republished"
            exit 1
          fi
      - name: Preview release notes
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "## Release notes for $TAG"
            echo
            cat build/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}

  assemble:
    name: Check the validated JARs
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: creator-current-${{ needs.prepare.outputs.version }}
          path: current
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: creator-legacy-${{ needs.prepare.outputs.version }}
          path: legacy
      - name: Require one JAR tested against both dependency profiles
        id: checksum
        run: |
          current=$(sha256sum current/*.jar | cut -d ' ' -f 1)
          legacy=$(sha256sum legacy/*.jar | cut -d ' ' -f 1)
          if [ "$current" != "$legacy" ]; then
            echo "::error::The current and legacy builds differ, so no single JAR passed both profiles"
            exit 1
          fi
          echo "sha256=$current" >> "$GITHUB_OUTPUT"
          {
            echo "## Validated JAR"
            echo
            echo "\`$(basename current/*.jar)\`, SHA-256 \`$current\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish GitHub release
    needs: [prepare, assemble]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Recreate the release notes
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/release.py prepare --event "$EVENT" --ref-name "$REF_NAME" --notes build/release-notes.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: creator-current-${{ needs.prepare.outputs.version }}
          path: release
      - name: Create the release at the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          EXPECTED_SHA256: ${{ needs.assemble.outputs.sha256 }}
        run: |
          jar=(release/*.jar)
          if [ "$(sha256sum "${jar[0]}" | cut -d ' ' -f 1)" != "$EXPECTED_SHA256" ]; then
            echo "::error::The downloaded JAR is not the validated artifact"
            exit 1
          fi
          args=(release create "$TAG" "${jar[0]}" --title "$TAG" --notes-file build/release-notes.md)
          if [ "$EVENT" = "push" ]; then
            args+=(--verify-tag)
          else
            # A dispatched release tags the commit captured when the run started, not the branch head now.
            args+=(--target "$SHA")
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
      - name: Confirm the published tag, notes and JAR
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          tagged=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$(jq -rn --arg tag "$TAG" '$tag|@uri')" --jq .sha)
          if [ "$tagged" != "$SHA" ]; then
            echo "::error::Tag $TAG points to $tagged instead of $SHA"
            exit 1
          fi
          gh release view "$TAG" --json assets,body --jq 'if (.assets | length) == 1 and (.body | length) > 0 then "ok" else error("missing JAR or notes") end'
