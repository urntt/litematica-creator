plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	maven {
		url = 'https://maven.fallenbreath.me/releases'
		content { includeGroupAndSubgroups('me.fallenbreath') }
	}
	maven {
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroupAndSubgroups('com.terraformersmc') }
	}
	maven {
		url = 'https://jitpack.io'
		content { includeGroupAndSubgroups('com.github') }
	}
}

def dependencyProfile = providers.gradleProperty('dependency_profile').getOrElse('current')
def dependencyPrefix = dependencyProfile == 'legacy' ? 'legacy_' : ''

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "com.google.code.findbugs:jsr305:3.0.2"

	implementation "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.property(dependencyPrefix + 'malilib_version')}"
	implementation "fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.property(dependencyPrefix + 'litematica_version')}"

	compileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

tasks.test {
	useJUnitPlatform()
}

base {
	group = project.group + "." + project.mod_id
	archivesName = project.mod_file_name + '-' + project.minecraft_version
	version = project.mod_version
}

loom {
	accessWidenerPath = file("src/main/resources/litematica-creator.accesswidener")
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'litematica-creator-gametest'
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionRuntimeMods "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.property(dependencyPrefix + 'malilib_version')}"
	productionRuntimeMods "fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.property(dependencyPrefix + 'litematica_version')}"
}

def clientGameTestJar = tasks.register('clientGameTestJar', Jar) {
	archiveClassifier = 'gametest'
	destinationDirectory = layout.buildDirectory.dir('gametest')
	from sourceSets.gametest.output
}

def cleanProductionGameTest = tasks.register('cleanProductionGameTest', Delete) {
	delete layout.buildDirectory.dir('run/productionClientGameTest')
}

tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	dependsOn cleanProductionGameTest
	mods.from(clientGameTestJar)
	runDir = layout.buildDirectory.dir('run/productionClientGameTest')
	jvmArgs.addAll('-Dfabric.client.gametest', '-Xmx2G')
	programArgs.addAll('--username', 'CreatorTest')
	if (providers.gradleProperty('verifyGameTestFailure').getOrElse('false') == 'true') {
		jvmArgs.add('-Dlitematica.creator.gametest.verifyFailure=true')
	}
}

processResources {
	def values = [mod_version: project.mod_version, minecraft_version: project.minecraft_version,
		fabric_loader_version: project.fabric_loader_version, java_version: project.java_version,
		malilib_version_range: project.malilib_version_range, litematica_version_range: project.litematica_version_range]
	inputs.properties(values)
	filesMatching(['fabric.mod.json', 'mixins.litematica_creator.json']) {
		expand(values)
	}
}

tasks.jar {
	from('LICENSE') { rename { "LICENSE_${project.mod_id}" } }
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = Integer.parseInt(project.java_version)
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
	withSourcesJar()
}

tasks.publish.dependsOn build

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
}
